<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143a5c"/>
      <stop offset="0.5" stop-color="#245f8f"/>
      <stop offset="1" stop-color="#67b8e3"/>
    </linearGradient>
    <radialGradient id="glowY" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd0f5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fd0f5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowX" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景渐变 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 顶部微弱光晕 -->
  <ellipse cx="960" cy="120" rx="900" ry="300" fill="#ffffff" opacity="0.06"/>

  <!-- 贝叶斯网络：证据节点 X1~X4 → 结果节点 Y -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" fill="none">
    <line x1="330" y1="205" x2="530" y2="330"/>
    <line x1="330" y1="300" x2="530" y2="330"/>
    <line x1="330" y1="395" x2="530" y2="330"/>
    <line x1="330" y1="490" x2="530" y2="330"/>
  </g>
  <g>
    <circle cx="330" cy="205" r="70" fill="url(#glowX)"/>
    <circle cx="330" cy="205" r="11" fill="#ffffff" opacity="0.85"/>
    <circle cx="330" cy="300" r="70" fill="url(#glowX)"/>
    <circle cx="330" cy="300" r="11" fill="#ffffff" opacity="0.85"/>
    <circle cx="330" cy="395" r="70" fill="url(#glowX)"/>
    <circle cx="330" cy="395" r="11" fill="#ffffff" opacity="0.85"/>
    <circle cx="330" cy="490" r="70" fill="url(#glowX)"/>
    <circle cx="330" cy="490" r="11" fill="#ffffff" opacity="0.85"/>
  </g>
  <g>
    <circle cx="530" cy="330" r="95" fill="url(#glowY)"/>
    <circle cx="530" cy="330" r="16" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- 散落的数据节点 -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="1200" cy="180" r="5"/>
    <circle cx="1330" cy="260" r="3"/>
    <circle cx="1480" cy="150" r="4"/>
    <circle cx="1600" cy="320" r="3"/>
    <circle cx="1720" cy="210" r="5"/>
    <circle cx="1820" cy="420" r="3"/>
    <circle cx="1430" cy="420" r="4"/>
    <circle cx="1550" cy="520" r="3"/>
    <circle cx="1680" cy="600" r="4"/>
    <circle cx="1080" cy="200" r="3"/>
    <circle cx="880" cy="150" r="4"/>
    <circle cx="760" cy="250" r="3"/>
    <circle cx="1000" cy="480" r="4"/>
    <circle cx="1150" cy="560" r="3"/>
  </g>

  <!-- 散落的连接线（数据流） -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5">
    <line x1="1200" y1="180" x2="1330" y2="260"/>
    <line x1="1480" y1="150" x2="1600" y2="320"/>
    <line x1="1720" y1="210" x2="1820" y2="420"/>
    <line x1="1430" y1="420" x2="1550" y2="520"/>
    <line x1="1550" y1="520" x2="1680" y2="600"/>
    <line x1="1000" y1="480" x2="1150" y2="560"/>
  </g>

  <!-- 校园建筑剪影 -->
  <g fill="#0f2f4b" opacity="0.6">
    <rect x="0" y="900" width="220" height="180"/>
    <rect x="240" y="840" width="150" height="240"/>
    <rect x="410" y="920" width="120" height="160"/>
    <rect x="550" y="860" width="180" height="220"/>
    <rect x="750" y="930" width="110" height="150"/>
    <rect x="880" y="820" width="140" height="260"/>
    <rect x="1040" y="900" width="170" height="180"/>
    <rect x="1230" y="850" width="130" height="230"/>
    <rect x="1380" y="920" width="150" height="160"/>
    <rect x="1550" y="870" width="120" height="210"/>
    <rect x="1690" y="920" width="230" height="160"/>
  </g>
  <!-- 建筑窗户 -->
  <g fill="#67b8e3" opacity="0.35">
    <rect x="280" y="860" width="18" height="22"/>
    <rect x="320" y="860" width="18" height="22"/>
    <rect x="280" y="910" width="18" height="22"/>
    <rect x="320" y="910" width="18" height="22"/>
    <rect x="600" y="880" width="18" height="22"/>
    <rect x="640" y="880" width="18" height="22"/>
    <rect x="680" y="880" width="18" height="22"/>
    <rect x="920" y="840" width="18" height="22"/>
    <rect x="960" y="840" width="18" height="22"/>
    <rect x="1260" y="870" width="18" height="22"/>
    <rect x="1300" y="870" width="18" height="22"/>
  </g>

  <!-- 底部光带 -->
  <rect x="0" y="1040" width="1920" height="40" fill="#0e2a44" opacity="0.55"/>
</svg>
